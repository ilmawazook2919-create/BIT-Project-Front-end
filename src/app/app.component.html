<body *ngIf="isLoggedIn()" class="app-shell">
  <nav class="navbar navbar-expand-lg app-topbar fixed-top">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample"
        aria-controls="offcanvasExample">
        <span class="navbar-toggler-icon"></span>
      </button>

      <a class="navbar-brand app-brand" routerLink="/dashboard">
        <span class="brand-mark"><i class="bi bi-box-seam"></i></span>
        Smart Spare System
      </a>

      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="role-pill" *ngIf="roleName">{{roleName}}</span>
        <div class="dropdown">
          <button class="btn user-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <button type="button" class="dropdown-item text-danger" (click)="logOut()">
                <i class="bi bi-box-arrow-right me-2"></i>Log out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start app-sidebar text-white" tabindex="-1" id="offcanvasExample"
    data-bs-backdrop="false" data-bs-scroll="true">
    <div class="offcanvas-body p-0">
      <nav class="side-nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="side-link">
          <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>

        <div class="side-label">Catalog</div>
        <a routerLink="/part" routerLinkActive="active" class="side-link">
          <i class="bi bi-box"></i><span>Parts</span>
        </a>
        <a routerLink="/category" routerLinkActive="active" class="side-link">
          <i class="bi bi-tags"></i><span>Categories</span>
        </a>

        <div class="side-label">Stores</div>
        <a routerLink="/warehouse" routerLinkActive="active" class="side-link">
          <i class="bi bi-building"></i><span>Warehouses</span>
        </a>
        <a routerLink="/bin" routerLinkActive="active" class="side-link">
          <i class="bi bi-grid-3x3-gap"></i><span>Bins</span>
        </a>
        <a routerLink="/inventoryLevel" routerLinkActive="active" class="side-link">
          <i class="bi bi-boxes"></i><span>Stock</span>
        </a>

        <div class="side-label">Purchasing</div>
        <a routerLink="/supplier" routerLinkActive="active" class="side-link">
          <i class="bi bi-truck"></i><span>Suppliers</span>
        </a>
        <a routerLink="/purchaseOrder" routerLinkActive="active" class="side-link">
          <i class="bi bi-receipt"></i><span>Purchase orders</span>
        </a>
        <a routerLink="/purchaseOrderItem" routerLinkActive="active" class="side-link">
          <i class="bi bi-list-check"></i><span>Order items</span>
        </a>
        <a routerLink="/goodsReceivedNote" routerLinkActive="active" class="side-link">
          <i class="bi bi-clipboard-check"></i><span>Goods received</span>
        </a>
        <a routerLink="/grnItem" routerLinkActive="active" class="side-link">
          <i class="bi bi-box-arrow-in-down"></i><span>Received items</span>
        </a>

        <div class="side-label">Customers</div>
        <a routerLink="/customer" routerLinkActive="active" class="side-link">
          <i class="bi bi-people"></i><span>Customers</span>
        </a>

        <div class="side-label">Institute</div>
        <a routerLink="/student" routerLinkActive="active" class="side-link">
          <i class="bi bi-person"></i><span>Students</span>
        </a>
        <a routerLink="/teacher" routerLinkActive="active" class="side-link">
          <i class="bi bi-person-video2"></i><span>Teachers</span>
        </a>
        <a routerLink="/course" routerLinkActive="active" class="side-link">
          <i class="bi bi-journal-text"></i><span>Courses</span>
        </a>
        <a routerLink="/class" routerLinkActive="active" class="side-link">
          <i class="bi bi-collection"></i><span>Classes</span>
        </a>

        <div class="side-label">Access</div>
        <a routerLink="/privilege" routerLinkActive="active" class="side-link">
          <i class="bi bi-shield-lock"></i><span>Privileges</span>
        </a>
      </nav>
    </div>
  </div>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</body>

<body *ngIf="!isLoggedIn()" class="app-shell guest-shell">
  <nav class="navbar app-topbar fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand app-brand" href="#">
        <span class="brand-mark"><i class="bi bi-box-seam"></i></span>
        Smart Spare System
      </a>
      <button class="btn btn-light fw-semibold ms-auto" *ngIf="!isLoggedIn()" (click)="logIn()">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </div>
  </nav>

  <div class="guest-outlet">
    <router-outlet></router-outlet>
  </div>
</body>
