<main class="inv-page">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="fw-bold fs-3">BINS</div>
      <button type="button" class="btn btn-primary btn-add" (click)="openCreate(formModal)"
        [disabled]="insertValue == '0'" title="New bin">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    <div class="card text-dark mb-3">
      <div class="card-header bg-info fw-bold">Bin list</div>
      <div class="card-body">
        <div class="input-group my-3">
          <input type="text" class="form-control" placeholder="Search bins" name="searchBin"
            [ngModel]="pager.searchText" (ngModelChange)="pager.searchText = $event; pager.page = 1">
          <button class="btn btn-info" type="button"><i class="bi bi-search"></i></button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead>
              <tr>
                <th>Code</th>
                <th>Description</th>
                <th>Status</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of pager.rows(bins)">
                <td>{{row.binCode}}</td>
                <td>{{row.binDescription}}</td>
                <td>{{row.status?.name || row.status}}</td>
                <td class="text-center">
                  <button class="btn btn-warning btn-sm me-1" [disabled]="updateBtn" (click)="openEdit(row.id, formModal)">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button class="btn btn-danger btn-sm" [disabled]="deleteValue == '0'" (click)="DeleteById(row.id)">
                    <i class="bi bi-archive"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="pager.rows(bins).length === 0">
                <td colspan="4" class="text-center text-muted py-4">No bins yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="list-pager">
          <span>{{pager.showing(bins)}}</span>
          <div>
            <button type="button" class="btn btn-outline-secondary btn-sm me-1" (click)="pager.previous()" [disabled]="pager.page <= 1">Previous</button>
            <span class="mx-1">{{pager.page}} / {{pager.pageCount(bins)}}</span>
            <button type="button" class="btn btn-outline-secondary btn-sm ms-1" (click)="pager.next(bins)" [disabled]="pager.page >= pager.pageCount(bins)">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<ng-template #formModal let-modal>
  <form (ngSubmit)="SaveBin()">
    <div class="modal-header">
      <h5 class="modal-title">{{isEditBin ? 'Update bin' : 'New bin'}}</h5>
      <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">Bin code</label>
        <input type="text" class="form-control" name="binCode" [(ngModel)]="binObj.binCode" required placeholder="Enter bin code">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="binDescription" rows="3" [(ngModel)]="binObj.binDescription" placeholder="Enter description"></textarea>
      </div>
      <div>
        <label class="form-label">Status</label>
        <select class="form-select" name="status" [(ngModel)]="binObj.status">
          <option [ngValue]="null" disabled>Select status</option>
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancel</button>
      <button class="btn btn-primary">{{isEditBin ? 'Update' : 'Save'}}</button>
    </div>
  </form>
</ng-template>
