<main class="inv-page">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="fw-bold fs-3">CATEGORIES</div>
      <button type="button" class="btn btn-primary btn-add" (click)="openCreate(formModal)"
        [disabled]="insertValue == '0'" title="New category">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>

    <div class="card text-dark mb-3">
      <div class="card-header bg-info fw-bold">Category list</div>
      <div class="card-body">
        <div class="input-group my-3">
          <input type="text" class="form-control" placeholder="Search categories" name="searchCategory"
            [ngModel]="pager.searchText" (ngModelChange)="pager.searchText = $event; pager.page = 1">
          <button class="btn btn-info" type="button"><i class="bi bi-search"></i></button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Status</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of pager.rows(categories)">
                <td>{{row.categoryName}}</td>
                <td>{{row.categoryDescription}}</td>
                <td>{{row.status?.name || row.status}}</td>
                <td class="text-center">
                  <button class="btn btn-warning btn-sm me-1" [disabled]="updateBtn" (click)="openEdit(row.id, formModal)">
                    <i class="bi bi-pencil-square"></i>
                  </button>
                  <button class="btn btn-danger btn-sm" [disabled]="deleteValue == '0'" (click)="DeleteCategoryById(row.id)">
                    <i class="bi bi-archive"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="pager.rows(categories).length === 0">
                <td colspan="4" class="text-center text-muted py-4">No categories yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="list-pager">
          <span>{{pager.showing(categories)}}</span>
          <div>
            <button type="button" class="btn btn-outline-secondary btn-sm me-1" (click)="pager.previous()" [disabled]="pager.page <= 1">Previous</button>
            <span class="mx-1">{{pager.page}} / {{pager.pageCount(categories)}}</span>
            <button type="button" class="btn btn-outline-secondary btn-sm ms-1" (click)="pager.next(categories)" [disabled]="pager.page >= pager.pageCount(categories)">Next</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<ng-template #formModal let-modal>
  <form (ngSubmit)="SaveCategory()">
    <div class="modal-header">
      <h5 class="modal-title">{{isEditCategory ? 'Update category' : 'New category'}}</h5>
      <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label">Category name</label>
        <input type="text" class="form-control" name="categoryName" [(ngModel)]="categoryObj.categoryName" required placeholder="Enter category name">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" class="form-control" name="categoryDescription" [(ngModel)]="categoryObj.categoryDescription" placeholder="Enter description">
      </div>
      <div>
        <label class="form-label">Status</label>
        <select class="form-select" name="status" [(ngModel)]="categoryObj.status">
          <option [ngValue]="{name:'ACTIVE'}">Active</option>
          <option [ngValue]="{name:'INACTIVE'}">Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" (click)="modal.dismiss()">Cancel</button>
      <button class="btn btn-primary">{{isEditCategory ? 'Update' : 'Save'}}</button>
    </div>
  </form>
</ng-template>
